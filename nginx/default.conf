upstream telegram-bot-api {
    server telegram-api-server:8081;
}

# Keep-alive to the bot. Without an upstream block (and HTTP/1.1 below) nginx
# opens a fresh TCP connection to tg_bot for every single webhook delivery.
upstream tg_bot {
    server tg_bot:80;
    keepalive 64;
}

# use $sanitized_request instead of $request to hide Telegram token
log_format token_filter '$remote_addr - $remote_user [$time_local] '
                        '"$sanitized_request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    chunked_transfer_encoding on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
    client_max_body_size 2G;
    client_body_buffer_size 30M;
    # Was 0, which disabled keep-alive entirely: every webhook delivery paid a
    # fresh TCP (and, behind Cloudflare, TLS) handshake.
    keepalive_timeout 65;

    set $sanitized_request $request;
    if ( $sanitized_request ~ (\w+)\s(\/bot\d+):[-\w]+\/(\S+)\s(.*) ) {
        set $sanitized_request "$1 $2:<hidden-token>/$3 $4";
    }
    access_log /var/log/nginx/access.log token_filter;

    # ---------------------------------------------------------------------
    # The webhook is the ONLY path that may be reached from the internet.
    #
    # Everything below it — the Bot API proxy and the file server — used to be
    # world-reachable on port 80. The Bot API server runs with
    # --allow-unauthorized-updates, and `location /file/bot<token>/…` served
    # every file the bot had ever downloaded. The bot itself never needs either
    # through nginx: it talks to telegram-api-server directly over the compose
    # network (TELEGRAM_API_BASE), so both are restricted to private ranges.
    #
    # Authentication for /webhook is the secret token checked by aiogram
    # (WEBHOOK_SECRET), not an IP allowlist: requests arrive from Cloudflare,
    # not from Telegram's own ranges, so an allowlist here would either break
    # delivery or have to be so wide it proves nothing.
    # ---------------------------------------------------------------------
    location /webhook {
        resolver 127.0.0.11 valid=5s;
        set $upstream_target tg_bot;
        proxy_pass http://$upstream_target:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^\/file\/bot\d+:[^\/]+[^\d]+(\/.*) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        rewrite ^\/file\/bot\d+:[^\/]+[^\d]+(\/.*) /$1 break;
        try_files $uri @files;
    }

    location / {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        try_files $uri @api;
    }

    # Named locations are reachable only via try_files above, never directly.
    location @files {
        root /var/lib/telegram-bot-api;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 64 8k;
        gzip_http_version 1.1;
        gzip_min_length 1100;
    }

    location @api {
        proxy_pass  http://telegram-bot-api;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}
